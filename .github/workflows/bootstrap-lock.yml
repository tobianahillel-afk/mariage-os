name: WP-0.1 bootstrap verification

on:
  push:
    branches:
      - lot-0/repository-tooling
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - index.html
      - src/**
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean reproducible install
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
