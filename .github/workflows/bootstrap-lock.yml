name: Lot 0 packet verification

on:
  push:
    branches:
      - lot-0/repository-tooling

permissions:
  contents: read

jobs:
  packet-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean reproducible install
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Static quality gates
        run: npm run static

      - name: Negative quality controls
        run: npm run quality:negative

      - name: Unit, property and coverage tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Mutation smoke
        run: npm run test:mutation

      - name: Production build
        run: npm run build
