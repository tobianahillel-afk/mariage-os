name: Lot 0 deterministic formatting

on:
  push:
    branches:
      - lot-0/repository-tooling
    paths:
      - .github/workflows/lot0-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit deterministic formatting
        shell: bash
        run: |
          git add src vite.config.ts eslint.config.js scripts package.json tsconfig.json tsconfig.app.json tsconfig.node.json index.html dependency-cruiser.config.mjs knip.json
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply deterministic Lot 0 formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
