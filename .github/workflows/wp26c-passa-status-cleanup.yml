name: WP-2.6C cursor cleanup staging

on:
  push:
    branches:
      - lot-2/wp26c-passa-transition-staging

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: lot-2/wp26c-passa-transition-staging
      - name: Replace exact stale cursor line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap/IMPLEMENTATION-STATUS.md')
          data = p.read_text()
          old = 'Required WP-2.6B responsibilities minus accepted/evidenced responsibilities: ∅\nNext permitted action: perform fresh WP-2.6C Pass B adversarial review after verifying this governance transition head.'
          new = 'WP-2.6C Pass-A implementation responsibility is VERIFIED but not yet ACCEPTED; packet acceptance remains pending Pass B + Pass C.\nNext permitted action: perform fresh WP-2.6C Pass B adversarial review after verifying this governance transition head.'
          if data.count(old) != 1:
              raise SystemExit(f'expected exactly one stale cursor block, found {data.count(old)}')
          p.write_text(data.replace(old, new))
          PY
          rm .github/workflows/wp26c-passa-status-cleanup.yml
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/IMPLEMENTATION-STATUS.md .github/workflows/wp26c-passa-status-cleanup.yml
          git commit -m "docs: clean WP-2.6C durable cursor"
          git push origin HEAD:lot-2/wp26c-passa-transition-staging
