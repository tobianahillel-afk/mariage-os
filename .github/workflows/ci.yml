name: Mariage OS CI

on:
  push:
    branches:
      - main
      - lot-0/repository-tooling
      - lot-1/identity-project-foundation
      - lot-2/venues-core
  pull_request:

permissions:
  contents: read

concurrency:
  group: mariage-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  core:
    name: Core quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run security:env:negative
      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npm run static
      - run: npm run quality:negative
      - run: npm run security:negative
      - run: npm run test:ar006:metrics
      - run: npm run test:unit
      - run: npm run security:dependencies
      - run: npm run build

  db:
    name: Local Supabase DB, RLS and Pages Function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run db:start
      - run: npm run db:verify
      - run: npm run test:promotion
      - if: always()
        run: npm run db:stop

  browser-and-mutation:
    name: Browser and mutation harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:mutation

  preview-artifact:
    name: Privacy-safe preview artifact
    needs:
      - core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run security:secrets
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mariage-os-static-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  full-verify:
    name: Full verify from clean checkout
    needs:
      - core
      - db
      - browser-and-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify

  ar006-provider-preflight:
    name: AR-006 isolated provider preflight
    needs:
      - core
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-PREFLIGHT]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      AR006_PRIVATE_DOCUMENT_WORKER: ${{ vars.AR006_PRIVATE_DOCUMENT_WORKER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_SUPABASE_URL: ${{ vars.AR006_SUPABASE_URL }}
      AR006_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AR006_SUPABASE_PUBLISHABLE_KEY }}
      AR006_TEST_USER_EMAIL: ${{ vars.AR006_TEST_USER_EMAIL }}
      AR006_PROJECT_ID: ${{ vars.AR006_PROJECT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Preflight isolated provider readiness without deployment
        env:
          AR006_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: npm run preflight:ar006

  ar006-provider-evidence:
    name: Exact 25 MB Workers Free provider evidence
    needs:
      - full-verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-EVIDENCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      AR006_PRIVATE_DOCUMENT_WORKER: ${{ vars.AR006_PRIVATE_DOCUMENT_WORKER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_SUPABASE_URL: ${{ vars.AR006_SUPABASE_URL }}
      AR006_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AR006_SUPABASE_PUBLISHABLE_KEY }}
      AR006_TEST_USER_EMAIL: ${{ vars.AR006_TEST_USER_EMAIL }}
      AR006_PROJECT_ID: ${{ vars.AR006_PROJECT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Guard isolated Workers Free evidence environment
        run: |
          set -eu
          test "$AR006_WORKERS_FREE_ATTESTATION" = "YES-WORKERS-FREE-ISOLATED"
          test -n "$AR006_PAGES_PROJECT"
          test -n "$AR006_PRIVATE_DOCUMENT_WORKER"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AR006_SUPABASE_URL"
          test -n "$AR006_SUPABASE_PUBLISHABLE_KEY"
          test -n "$AR006_TEST_USER_EMAIL"
          test -n "$AR006_PROJECT_ID"
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Preflight isolated provider readiness before deployment
        env:
          AR006_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: npm run preflight:ar006
      - run: npm run build
      - name: Deploy private Worker before the Pages caller
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$AR006_PRIVATE_DOCUMENT_WORKER" = "mariage-os-private-document-promotion"
          npx --yes wrangler@4.131.2 deploy \
            --config workers/private-document-promotion/wrangler.jsonc \
            --keep-vars
      - name: Deploy exact candidate to isolated Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          EVIDENCE_BRANCH="ar006-$(printf '%.12s' "$GITHUB_SHA")"
          npx --yes wrangler@4.131.2 pages deploy dist \
            --project-name "$AR006_PAGES_PROJECT" \
            --branch "$EVIDENCE_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WP-2.9C AR-006 provider evidence"
      - name: Resolve and validate exact deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$AR006_PAGES_PROJECT"
          PROJECT_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$PROJECT_URL")"
          printf '%s' "$PROJECT_JSON" | jq -e '.success == true' >/dev/null
          printf '%s' "$PROJECT_JSON" | jq -e '.result.uses_functions == true' >/dev/null
          printf '%s' "$PROJECT_JSON" | jq -e \
            '.result.deployment_configs.preview.env_vars.PRIVATE_DOCUMENT_ADMIN_KEY.type == "secret_text"' >/dev/null
          printf '%s' "$PROJECT_JSON" | jq -e --arg value "$AR006_SUPABASE_URL" \
            '.result.deployment_configs.preview.env_vars.SUPABASE_URL.value == $value' >/dev/null
          printf '%s' "$PROJECT_JSON" | jq -e --arg value "$AR006_SUPABASE_PUBLISHABLE_KEY" \
            '.result.deployment_configs.preview.env_vars.SUPABASE_PUBLISHABLE_KEY.value == $value' >/dev/null
          printf '%s' "$PROJECT_JSON" | jq -e --arg worker "$AR006_PRIVATE_DOCUMENT_WORKER" '
            .result.deployment_configs.preview.services as $services
            | if ($services | type) == "array" then
                [$services[]? | select(.binding == "PRIVATE_DOCUMENT_PROMOTION_WORKER" and .service == $worker)]
                | length == 1
              elif ($services | type) == "object" then
                $services.PRIVATE_DOCUMENT_PROMOTION_WORKER.service == $worker
              else
                false
              end
          ' >/dev/null
          SCRIPT_NAME="$(printf '%s' "$PROJECT_JSON" | jq -r '.result.preview_script_name // empty')"
          test -n "$SCRIPT_NAME"
          DEPLOYMENTS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$PROJECT_URL/deployments")"
          printf '%s' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null
          DEPLOYMENT="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -c --arg sha "$GITHUB_SHA" \
            '[.result[] | select(.environment == "preview" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success" and .uses_functions == true)] | sort_by(.created_on) | last')"
          test "$DEPLOYMENT" != "null"
          DEPLOYMENT_URL="$(printf '%s' "$DEPLOYMENT" | jq -r '.url // empty')"
          DEPLOYMENT_ID="$(printf '%s' "$DEPLOYMENT" | jq -r '.id // empty')"
          DEPLOYMENT_BRANCH="$(printf '%s' "$DEPLOYMENT" | jq -r '.deployment_trigger.metadata.branch // empty')"
          test -n "$DEPLOYMENT_URL"
          test -n "$DEPLOYMENT_ID"
          test -n "$DEPLOYMENT_BRANCH"
          {
            echo "AR006_DEPLOYMENT_URL=$DEPLOYMENT_URL"
            echo "AR006_DEPLOYMENT_ID=$DEPLOYMENT_ID"
            echo "AR006_DEPLOYMENT_BRANCH=$DEPLOYMENT_BRANCH"
            echo "AR006_SCRIPT_NAME=$SCRIPT_NAME"
          } >> "$GITHUB_ENV"
      - name: Deny-oriented Pages Function smoke
        run: PRIVATE_DOCUMENT_SMOKE_BASE_URL="$AR006_DEPLOYMENT_URL" npm run smoke:private-document-production
      - name: Collect exact-size promotion and CPU evidence
        env:
          AR006_EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_OBSERVABILITY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: node scripts/run-private-document-ar006-worker-evidence.mjs
      - name: Retain sanitized AR-006 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-${{ github.sha }}
          path: ar006-workers-free-evidence.json
          if-no-files-found: warn
          retention-days: 30

  ar006-token-diagnostic:
    name: AR-006 isolated Observability token diagnostic
    needs:
      - full-verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-TOKEN-DIAGNOSTIC]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ar006-isolated
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Verify existing encrypted token at both owner endpoints
        env:
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_OBSERVABILITY_TOKEN }}
        run: node scripts/run-private-document-ar006-token-diagnostic.mjs
      - name: Retain sanitized token diagnostic
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-token-diagnostic-${{ github.sha }}
          path: ar006-observability-token-diagnostic.json
          if-no-files-found: warn
          retention-days: 30

  ar006-worker-evidence-requery:
    name: AR-006 private Worker telemetry requery
    needs:
      - full-verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-WORKER-REQUERY]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ar006-isolated
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Re-query retained private Worker telemetry without mutation
        env:
          CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_OBSERVABILITY_TOKEN }}
        run: node scripts/run-private-document-ar006-worker-requery.mjs
      - name: Retain sanitized AR-006 Worker telemetry requery
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-worker-requery-${{ github.sha }}
          path: ar006-workers-free-worker-requery.json
          if-no-files-found: warn
          retention-days: 30
