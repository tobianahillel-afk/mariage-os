name: Mariage OS CI

on:
  push:
    branches:
      - main
      - lot-0/repository-tooling
      - lot-1/identity-project-foundation
      - lot-2/venues-core
  pull_request:

permissions:
  contents: read

concurrency:
  group: mariage-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  core:
    name: Core quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run security:env:negative
      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npm run static
      - run: npm run quality:negative
      - run: npm run security:negative
      - run: npm run test:ar006:metrics
      - run: npm run test:unit
      - run: npm run security:dependencies
      - run: npm run build

  db:
    name: Local Supabase DB, RLS and Pages Function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run db:start
      - run: npm run db:verify
      - run: npm run test:promotion
      - if: always()
        run: npm run db:stop

  browser-and-mutation:
    name: Browser and mutation harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:mutation

  preview-artifact:
    name: Privacy-safe preview artifact
    needs:
      - core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:env
      - run: npm run security:secrets
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mariage-os-static-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  full-verify:
    name: Full verify from clean checkout
    needs:
      - core
      - db
      - browser-and-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify

  ar006-provider-preflight:
    name: AR-006 ADR 0012 isolated Durable Object preflight
    needs:
      - full-verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-DO-PREFLIGHT]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      AR006_PRIVATE_DOCUMENT_WORKER: ${{ vars.AR006_PRIVATE_DOCUMENT_WORKER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_SUPABASE_URL: ${{ vars.AR006_SUPABASE_URL }}
      AR006_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AR006_SUPABASE_PUBLISHABLE_KEY }}
      AR006_TEST_USER_EMAIL: ${{ vars.AR006_TEST_USER_EMAIL }}
      AR006_PROJECT_ID: ${{ vars.AR006_PROJECT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Guard isolated ADR 0012 preflight environment
        run: |
          set -eu
          test "$AR006_WORKERS_FREE_ATTESTATION" = "YES-WORKERS-FREE-ISOLATED"
          test "$AR006_PRIVATE_DOCUMENT_WORKER" = "mariage-os-private-document-promotion"
          test -n "$AR006_PAGES_PROJECT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AR006_SUPABASE_URL"
          test -n "$AR006_SUPABASE_PUBLISHABLE_KEY"
          test -n "$AR006_TEST_USER_EMAIL"
          test -n "$AR006_PROJECT_ID"
      - name: Deploy private Durable Object host after exact-head verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.131.2 deploy \
            --config workers/private-document-promotion/wrangler.jsonc \
            --keep-vars
      - name: Configure Pages Preview direct Durable Object binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: node scripts/configure-ar006-pages-preview.mjs
      - name: Retain sanitized Durable Object binding receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-do-binding-${{ github.sha }}
          path: ar006-pages-preview-config.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify provider bindings, Worker secret and synthetic authority
        env:
          AR006_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: npm run preflight:ar006
      - run: npm run build
      - name: Deploy exact ADR 0012 candidate to isolated Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          PREFLIGHT_BRANCH="ar006-do-preflight-$(printf '%.12s' "$GITHUB_SHA")"
          npx --yes wrangler@4.131.2 pages deploy dist \
            --project-name "$AR006_PAGES_PROJECT" \
            --branch "$PREFLIGHT_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WP-2.9C ADR 0012 provider preflight"
      - name: Resolve exact preflight deployment URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$AR006_PAGES_PROJECT"
          DEPLOYMENTS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$PROJECT_URL/deployments")"
          printf '%s' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null
          DEPLOYMENT="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -c --arg sha "$GITHUB_SHA" \
            '[.result[] | select(.environment == "preview" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success" and .uses_functions == true)] | sort_by(.created_on) | last')"
          test "$DEPLOYMENT" != "null"
          DEPLOYMENT_URL="$(printf '%s' "$DEPLOYMENT" | jq -r '.url // empty')"
          test -n "$DEPLOYMENT_URL"
          echo "AR006_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
      - name: Deny-oriented Pages Function smoke
        run: PRIVATE_DOCUMENT_SMOKE_BASE_URL="$AR006_DEPLOYMENT_URL" npm run smoke:private-document-production
      - name: Prove Pages reaches the lifecycle DO without document mutation
        env:
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: node scripts/run-private-document-ar006-do-route-preflight.mjs

  ar006-do-preflight-readonly:
    name: AR-006 ADR 0012 existing deployment non-mutating completion
    needs:
      - full-verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lot-2/venues-core' &&
      contains(github.event.head_commit.message, '[AR006-DO-PREFLIGHT-READONLY]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      AR006_PRIVATE_DOCUMENT_WORKER: ${{ vars.AR006_PRIVATE_DOCUMENT_WORKER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_SUPABASE_URL: ${{ vars.AR006_SUPABASE_URL }}
      AR006_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AR006_SUPABASE_PUBLISHABLE_KEY }}
      AR006_TEST_USER_EMAIL: ${{ vars.AR006_TEST_USER_EMAIL }}
      AR006_PROJECT_ID: ${{ vars.AR006_PROJECT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
      AR006_PREFLIGHT_CANDIDATE_SHA: eca478937fad40632dc378f0408c1c8ec4bd5c8c
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Guard existing-deployment continuation
        run: |
          set -eu
          test "$AR006_WORKERS_FREE_ATTESTATION" = "YES-WORKERS-FREE-ISOLATED"
          test "$AR006_PRIVATE_DOCUMENT_WORKER" = "mariage-os-private-document-promotion"
          test "$AR006_PREFLIGHT_CANDIDATE_SHA" = "eca478937fad40632dc378f0408c1c8ec4bd5c8c"
      - name: Re-verify provider bindings, Worker secret and synthetic authority without mutation
        env:
          AR006_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: npm run preflight:ar006
      - name: Resolve the exact existing ADR 0012 deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$AR006_PAGES_PROJECT"
          DEPLOYMENTS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$PROJECT_URL/deployments")"
          printf '%s' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null
          MATCHES="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -c --arg sha "$AR006_PREFLIGHT_CANDIDATE_SHA" \
            '[.result[] | select(.environment == "preview" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success" and .uses_functions == true)]')"
          test "$(printf '%s' "$MATCHES" | jq 'length')" -eq 1
          DEPLOYMENT="$(printf '%s' "$MATCHES" | jq -c '.[0]')"
          DEPLOYMENT_URL="$(printf '%s' "$DEPLOYMENT" | jq -r '.url // empty')"
          DEPLOYMENT_ID="$(printf '%s' "$DEPLOYMENT" | jq -r '.id // empty')"
          test -n "$DEPLOYMENT_URL"
          test -n "$DEPLOYMENT_ID"
          echo "AR006_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          jq -n \
            --arg sha "$AR006_PREFLIGHT_CANDIDATE_SHA" \
            --arg id "$DEPLOYMENT_ID" \
            --arg url "$DEPLOYMENT_URL" \
            '{schema:"mariage-os.wp29c.ar006.do-preflight-readonly.v1",candidateSha:$sha,deploymentId:$id,deploymentUrl:$url,environment:"preview",usesFunctions:true}' \
            > ar006-do-preflight-readonly.json
      - name: Retain sanitized existing-deployment receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-do-preflight-readonly-${{ github.sha }}
          path: ar006-do-preflight-readonly.json
          if-no-files-found: error
          retention-days: 30
      - name: Bounded deny-oriented readiness smoke on exact existing deployment
        run: PRIVATE_DOCUMENT_SMOKE_BASE_URL="$AR006_DEPLOYMENT_URL" npm run smoke:private-document-production
      - name: Prove exact existing Pages deployment reaches the lifecycle DO without document mutation
        env:
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: node scripts/run-private-document-ar006-do-route-preflight.mjs

  # [AR006-DO-EVIDENCE] remains inert on ordinary commits. A bounded campaign
  # requires an explicit reviewed marker commit after this job itself is green.
  ar006-provider-evidence:
    name: ADR 0012 exact-size two-surface provider evidence
    needs:
      - full-verify
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      AR006_PRIVATE_DOCUMENT_WORKER: ${{ vars.AR006_PRIVATE_DOCUMENT_WORKER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_SUPABASE_URL: ${{ vars.AR006_SUPABASE_URL }}
      AR006_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AR006_SUPABASE_PUBLISHABLE_KEY }}
      AR006_TEST_USER_EMAIL: ${{ vars.AR006_TEST_USER_EMAIL }}
      AR006_PROJECT_ID: ${{ vars.AR006_PROJECT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Guard isolated ADR 0012 evidence environment
        run: |
          set -eu
          test "$AR006_WORKERS_FREE_ATTESTATION" = "YES-WORKERS-FREE-ISOLATED"
          test "$AR006_PRIVATE_DOCUMENT_WORKER" = "mariage-os-private-document-promotion"
          test -n "$AR006_PAGES_PROJECT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AR006_SUPABASE_URL"
          test -n "$AR006_SUPABASE_PUBLISHABLE_KEY"
          test -n "$AR006_TEST_USER_EMAIL"
          test -n "$AR006_PROJECT_ID"
      - name: Snapshot current private Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          WORKER_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$AR006_PRIVATE_DOCUMENT_WORKER"
          BEFORE_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$WORKER_URL/deployments")"
          printf '%s' "$BEFORE_JSON" | jq -e '.success == true' >/dev/null
          PREVIOUS_ID="$(printf '%s' "$BEFORE_JSON" | jq -r '(.result.deployments // []) | sort_by(.created_on) | last | .id // empty')"
          echo "AR006_WORKER_PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_ID" >> "$GITHUB_ENV"
      - name: Deploy exact private Durable Object host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.131.2 deploy \
            --config workers/private-document-promotion/wrangler.jsonc \
            --keep-vars
      - name: Capture exact Worker deployment and version identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: |
          set -eu
          WORKER_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$AR006_PRIVATE_DOCUMENT_WORKER"
          AFTER_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$WORKER_URL/deployments")"
          printf '%s' "$AFTER_JSON" | jq -e '.success == true' >/dev/null
          DEPLOYMENT="$(printf '%s' "$AFTER_JSON" | jq -c '(.result.deployments // []) | sort_by(.created_on) | last')"
          test "$DEPLOYMENT" != "null"
          DEPLOYMENT_ID="$(printf '%s' "$DEPLOYMENT" | jq -r '.id // empty')"
          test -n "$DEPLOYMENT_ID"
          test "$DEPLOYMENT_ID" != "$AR006_WORKER_PREVIOUS_DEPLOYMENT_ID"
          test "$(printf '%s' "$DEPLOYMENT" | jq '.versions | length')" -eq 1
          test "$(printf '%s' "$DEPLOYMENT" | jq -r '.versions[0].percentage')" = "100"
          VERSION_ID="$(printf '%s' "$DEPLOYMENT" | jq -r '.versions[0].version_id // empty')"
          test -n "$VERSION_ID"
          VERSION_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$WORKER_URL/versions/$VERSION_ID")"
          printf '%s' "$VERSION_JSON" | jq -e '.success == true' >/dev/null
          printf '%s' "$VERSION_JSON" | jq -e --arg id "$VERSION_ID" '.result.id == $id' >/dev/null
          printf '%s' "$VERSION_JSON" | jq -e \
            '(.result.resources.script.named_handlers // []) | any(.name == "PrivateDocumentLifecycle")' >/dev/null
          echo "AR006_WORKER_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "AR006_WORKER_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          jq -n \
            --arg script "$AR006_PRIVATE_DOCUMENT_WORKER" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg versionId "$VERSION_ID" \
            --arg createdOn "$(printf '%s' "$DEPLOYMENT" | jq -r '.created_on // empty')" \
            --arg source "$(printf '%s' "$DEPLOYMENT" | jq -r '.source // empty')" \
            --arg versionSource "$(printf '%s' "$VERSION_JSON" | jq -r '.result.metadata.source // empty')" \
            '{schema:"mariage-os.wp29c.ar006.worker-deployment.v1",script:$script,deploymentId:$deploymentId,versionId:$versionId,percentage:100,createdOn:$createdOn,source:$source,versionSource:$versionSource,namedHandler:"PrivateDocumentLifecycle"}' \
            > ar006-do-worker-deployment.json
      - name: Retain sanitized exact Worker deployment receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-do-worker-deployment-${{ github.sha }}
          path: ar006-do-worker-deployment.json
          if-no-files-found: error
          retention-days: 30
      - name: Re-verify ADR 0012 binding, Worker secret and synthetic authority
        env:
          AR006_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
          AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN: ${{ secrets.AR006_CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          AR006_TEST_USER_PASSWORD: ${{ secrets.AR006_TEST_USER_PASSWORD }}
        run: npm run preflight:ar006
      - run: npm run build
      - name: Deploy exact evidence candidate to isolated Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          EVIDENCE_BRANCH="ar006-do-evidence-$(printf '%.12s' "$GITHUB_SHA")"
          echo "AR006_DEPLOYMENT_BRANCH=$EVIDENCE_BRANCH" >> "$GITHUB_ENV"
          npx --yes wrangler@4.131.2 pages deploy dist \
            --project-name "$AR006_PAGES_PROJECT" \
            --branch "$EVIDENCE_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "WP-2.9C ADR 0012 exact-size provider evidence"
      - name: Resolve unique exact evidence deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$AR006_PAGES_PROJECT"
          DEPLOYMENTS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$PROJECT_URL/deployments")"
          printf '%s' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null
          MATCHES="$(printf '%s' "$DEPLOYMENTS_JSON" | jq -c --arg sha "$GITHUB_SHA" \
            '[.result[] | select(.environment == "preview" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success" and .uses_functions == true)]')"
          test "$(printf '%s' "$MATCHES" | jq 'length')" -eq 1
          DEPLOYMENT="$(printf '%s' "$MATCHES" | jq -c '.[0]')"
          DEPLOYMENT_URL="$(printf '%s' "$DEPLOYMENT" | jq -r '.url // empty')"
          DEPLOYMENT_ID="$(printf '%s' "$DEPLOYMENT" | jq -r '.id // empty')"
          test -n "$DEPLOYMENT_URL"
          test -n "$DEPLOYMENT_ID"
          echo "AR006_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "AR006_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "AR006_EXPECTED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg id "$DEPLOYMENT_ID" \
            --arg url "$DEPLOYMENT_URL" \
            --arg branch "$AR006_DEPLOYMENT_BRANCH" \
