name: WP-2.2 Prettier Probe 2

on:
  push:
    branches:
      - tooling/wp22-prettier-probe-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed WP-2.2 files
        run: |
          npx prettier --write \
            src/domain/venues/venue-space.ts \
            src/domain/venues/venue-member-opinion.test.ts \
            src/domain/venues/venue-space.test.ts \
            src/infrastructure/supabase/parse-venue-space-row.test.ts \
            src/infrastructure/supabase/supabase-venue-member-opinion-adapter.test.ts
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/venues src/infrastructure/supabase
          git commit -m "style: format WP-2.2 lint refactor"
          git push
