name: Advance WP-2.6B to Pass C

on:
  push:
    branches:
      - lot-2/venues-core
    paths:
      - .github/workflows/advance-wp26b-pass-c.yml

permissions:
  contents: write

jobs:
  advance_governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply guarded governance transition
        run: |
          python .tmp/advance_wp26b_pass_c.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/lot-2/WP-2.6B.md docs/roadmap/IMPLEMENTATION-STATUS.md
          git rm .tmp/advance_wp26b_pass_c.py .github/workflows/advance-wp26b-pass-c.yml
          git commit -m "docs: advance WP-2.6B to Pass C"
          git push origin HEAD:lot-2/venues-core
