name: Repair WP-2.6B Pass C governance

on:
  push:
    branches:
      - lot-2/venues-core
    paths:
      - .github/workflows/repair-wp26b-pass-c-governance.yml

permissions:
  contents: write

jobs:
  repair_governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply guarded governance repair
        run: |
          python .tmp/repair_wp26b_pass_c_governance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/lot-2/WP-2.6B.md docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md docs/FEATURE-LEDGER.md
          git rm .tmp/repair_wp26b_pass_c_governance.py .github/workflows/repair-wp26b-pass-c-governance.yml
          git commit -m "docs: repair WP-2.6B Pass C governance"
          git push origin HEAD:lot-2/venues-core
