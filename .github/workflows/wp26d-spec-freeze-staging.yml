name: WP-2.6D specification freeze staging

on:
  push:
    branches:
      - lot-2/wp26d-spec-freeze-staging

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply asserted WP-2.6D specification freeze
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new))

          boundary = "docs/domain/VENUE-COMMERCIAL-WORKFLOW-BOUNDARY-ADDENDUM.md"
          replace_exact(
              boundary,
              "Purpose: close the implementation-level ambiguities left intentionally open by `VENUE-COMMERCIAL-WORKFLOW-ADDENDUM.md`: canonical phone/WhatsApp storage, retry/idempotency semantics for append-oriented Venue commercial history, and deterministic availability read-model selection.",
              "Purpose: close the implementation-level ambiguities left intentionally open by `VENUE-COMMERCIAL-WORKFLOW-ADDENDUM.md`: canonical phone/WhatsApp storage, retry/idempotency semantics for append-oriented Venue commercial history, deterministic availability read-model selection, and deterministic interaction-history ordering across PostgreSQL/provider/TypeScript precision boundaries."
          )
          marker = "## 3. Mutable create/update entities"
          section = """### 2.4 Deterministic Venue interaction-history read model\n\nVenue-owned `interactions` remains append-only historical evidence. Listing history is a derived read-model operation only and never changes a stored interaction.\n\nFor one authorized project and Venue, the canonical complete history order is:\n\n1. `occurred_at DESC` — the most recent business interaction instant first;\n2. `created_at DESC` — if business instants are equal, the most recently appended stored interaction first;\n3. canonical UUID `id ASC` — final stable tie-break only when both instants are equal.\n\nThe UUID tie-break carries no business-recency meaning. `contact_id`, `source_id`, `interaction_type` and `next_follow_up_at` do not partition or reorder the Venue history. Filters or later UI projections may narrow a result set, but any chronological interaction-history projection that claims canonical order uses the complete order above.\n\nBoth `occurred_at` and non-null `next_follow_up_at` independently use the frozen strict absolute-instant profile in `DATES-TIME.md`. V1 does **not** impose `next_follow_up_at > occurred_at`: the follow-up instant is optional planning metadata, not a second historical event or a Task lifecycle transition. It is excluded from replay ordering and from chronological-history selection.\n\nPostgreSQL retains up to microsecond precision while TypeScript canonical instant strings may retain only milliseconds. Therefore a provider/Supabase query that supplies canonical interaction history must request the complete database order `occurred_at DESC, created_at DESC, id ASC`; after fail-closed row/identity validation, application code preserves that provider order. It must not parse rows to millisecond precision and then re-sort them in TypeScript, because two distinct PostgreSQL instants inside the same millisecond could be inverted by a later UUID tie-break.\n\nProvider responses are still untrusted: every row must belong to the requested project/Venue and satisfy the frozen interaction domain/replay invariants, duplicate row identities fail closed, and malformed timestamps/payloads are rejected. Preserving provider order is permitted only because the query itself explicitly requests the full canonical order and the returned rows are then validated without reordering.\n\nRequired regression evidence includes:\n\n- two `occurred_at` values in the same JavaScript millisecond but distinct PostgreSQL microseconds retain database chronology after provider parsing;\n- equal `occurred_at` rows use `created_at DESC`;\n- equal `occurred_at` and `created_at` rows use `id ASC`;\n- `next_follow_up_at` does not affect history ordering and is accepted/rejected solely by the strict instant grammar when non-null;\n- provider rows with malformed identity/timestamps, duplicate IDs or wrong project/Venue fail closed.\n\n"""
          replace_exact(boundary, marker, section + marker)
          replace_exact(
              boundary,
              "- availability latest/relevant selection follows the complete canonical `observed_at DESC, created_at DESC, id ASC` order independently from provider row order;\n- elapsed `option_held` derives effective `expired` without mutating or appending history;",
              "- availability latest/relevant selection follows the complete canonical `observed_at DESC, created_at DESC, id ASC` order independently from provider row order;\n- interaction history follows the complete canonical `occurred_at DESC, created_at DESC, id ASC` database order and is not re-sorted after TypeScript millisecond canonicalization;\n- interaction ordering remains stable for PostgreSQL microsecond values inside one JavaScript millisecond, equal-instant ties and UUID ties;\n- `next_follow_up_at` is independently strict optional metadata, has no ordering role and has no invented temporal inequality against `occurred_at`;\n- elapsed `option_held` derives effective `expired` without mutating or appending history;"
          )
          replace_exact(
              boundary,
              "It only freezes the deterministic WP-2.6 contact-value, append-retry and availability read-model boundaries needed before Pass A.",
              "It only freezes the deterministic WP-2.6 contact-value, append-retry, availability read-model and interaction-history ordering boundaries needed before the owning packet enters Pass A."
          )

          c = "docs/roadmap/lot-2/WP-2.6C.md"
          replace_exact(
              c,
              "- Pass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**; responsibility gap **∅**; Pass C **PASS**\n- Next permitted action: verify the exact WP-2.6C acceptance-governance HEAD. Only after that 5/5 verification may WP-2.6D activation/revalidation begin; WP-2.7 remains blocked.",
              "- Pass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**; responsibility gap **∅**; Pass C **PASS**\n- Final acceptance-governance head/run: `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2 — **5/5 SUCCESS**. Attempt 1 failed only because the clean-checkout runner could not bind local Supabase port `54322`; rerunning that exact failed job on the unchanged HEAD passed, so no product or test remediation was required.\n- Next permitted action: WP-2.6D activation specification may proceed. WP-2.7 remains blocked until WP-2.6D is accepted."
          )

          d = "docs/roadmap/lot-2/WP-2.6D.md"
          replace_exact(
              d,
              "- Required prior packets/features: WP-2.1, WP-2.6A and WP-2.6B **ACCEPTED**; `WP-2.6C` must be **ACCEPTED** before activation so contact-parent integrity can be implemented against stable contact semantics.",
              "- Required prior packets/features: WP-2.1, WP-2.6A, WP-2.6B and WP-2.6C **ACCEPTED**. WP-2.6C final acceptance-governance verification is `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2 — **5/5 SUCCESS**; contact-parent integrity can therefore rely on stable accepted contact semantics."
          )
          replace_exact(
              d,
              "- Activation remains intentionally deferred until WP-2.6C is accepted; revalidate exact history ordering/provider precision and shared contact interfaces before `READY`.",
              "- WP-2.6C dependency gate is closed by `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2 — **5/5 SUCCESS**.\n- Activation revalidation found one material pre-code ambiguity: the frozen interaction contract defined append/replay history but not a complete deterministic read order across PostgreSQL microsecond precision and TypeScript millisecond canonicalization.\n- This specification freeze closes that ambiguity normatively: Venue interaction history order is `occurred_at DESC`, then `created_at DESC`, then canonical UUID `id ASC`. Supabase/provider queries must request the complete order; after fail-closed identity/domain validation the application preserves it and must not re-sort parsed millisecond timestamps.\n- `next_follow_up_at` remains independently validated optional metadata. No `next_follow_up_at > occurred_at` rule is invented because no frozen product contract requires one, and it never participates in history ordering.\n- Accepted WP-2.6C exposes stable `projectId` + `venueId` + contact UUID semantics, so same-Venue `contact_id` integrity is implementable without reopening contact mutation scope.\n- The packet remains `PLANNED / PLAN` until this specification-freeze HEAD itself is 5/5 green; only then may a separate governance transition mark WP-2.6D `READY`."
          )
          replace_exact(
              d,
              "- domain rules/invariants: strict instants, bounded text, same-Venue contact/source integrity, immutable replay equality.",
              "- domain rules/invariants: strict instants, bounded text, same-Venue contact/source integrity, immutable replay equality, and deterministic `occurred_at DESC, created_at DESC, id ASC` history ordering preserved across provider precision boundaries."
          )
          replace_exact(
              d,
              "- Dependency blocker: WP-2.6C must be accepted first\n- Remaining activation review: revalidate exact history ordering/provider timestamp precision and shared contact interface after WP-2.6C\n- Next permitted action: none while WP-2.6C is current. Do not start WP-2.7 concurrently.",
              "- Dependency gate: WP-2.6C **ACCEPTED / acceptance-governance verified** on `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2\n- Activation specification: deterministic history ordering/provider precision and accepted contact interface are now frozen; no material specification ambiguity remains, subject to exact-head CI of this freeze\n- Next permitted action: verify this specification-freeze HEAD 5/5. If green, perform the separate `PLANNED / PLAN` → `READY / A-IMPLEMENT` governance transition. Do not start product code or WP-2.7 before that transition is verified."
          )

          status = "docs/roadmap/IMPLEMENTATION-STATUS.md"
          replace_exact(
              status,
              "- WP-2.6C ACCEPTED; fresh Pass B `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` 5/5 with no open BLOCKING/MAJOR finding; Pass-C entry `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` 5/5; contact responsibility gap **∅**; whole `FTR-026` remains incomplete pending WP-2.6D/WP-2.11/Lot 3.",
              "- WP-2.6C ACCEPTED; fresh Pass B `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` 5/5; Pass-C entry `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` 5/5; final acceptance-governance `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2 **5/5 SUCCESS** after retrying an attempt-1 runner-only Supabase port collision; contact responsibility gap **∅**; whole `FTR-026` remains incomplete pending WP-2.6D/WP-2.11/Lot 3."
          )
          replace_exact(
              status,
              "- `WP-2.6D` — Venue interaction history — **PLANNED / PLAN**, estimated 9 points with append/replay/history cohesion.",
              "- `WP-2.6D` — Venue interaction history — **PLANNED / PLAN**, estimated 9 points with append/replay/history cohesion; activation revalidation is now freezing deterministic `occurred_at DESC, created_at DESC, id ASC` ordering and provider precision handling before READY."
          )
          replace_exact(
              status,
              "Current packet: WP-2.6C — ACCEPTED / COMPLETE\nCurrent commercial packet: WP-2.6C — ACCEPTED / COMPLETE\nFollowing commercial packet: WP-2.6D — PLANNED / PLAN",
              "Current packet: WP-2.6D — PLANNED / PLAN\nCurrent commercial packet: WP-2.6D — PLANNED / PLAN\nPrevious commercial packet: WP-2.6C — ACCEPTED / COMPLETE"
          )
          replace_exact(
              status,
              "WP-2.6C Pass-C entry: b8d451ec... / 34286647702 — 5/5 SUCCESS; responsibility gap ∅; Pass C PASS\nNext permitted action: verify the exact WP-2.6C acceptance-governance HEAD; then activate/revalidate WP-2.6D. WP-2.7 remains prohibited concurrently.",
              "WP-2.6C Pass-C entry: b8d451ec... / 34286647702 — 5/5 SUCCESS; responsibility gap ∅; Pass C PASS\nWP-2.6C acceptance governance: f6c93b79... / 34287865010 attempt 2 — 5/5 SUCCESS; attempt-1 clean-checkout failure was runner-local port 54322 collision only\nWP-2.6D activation stop-condition: deterministic interaction ordering/provider precision is frozen by the current specification commit; packet remains PLANNED / PLAN pending exact-head CI\nNext permitted action: verify the exact WP-2.6D specification-freeze HEAD 5/5; then transition WP-2.6D to READY / A-IMPLEMENT. WP-2.7 remains prohibited concurrently."
          )

          matrix = "docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md"
          replace_exact(
              matrix,
              "Pass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**. Mechanical contact reconciliation: **PASS**; required WP-2.6C responsibilities minus accepted/evidenced responsibilities: **∅**. No dedicated `VEN-xxx`/`ACC-xxx` is invented for `FTR-026`; whole feature remains incomplete downstream.\nNext permitted action: verify this WP-2.6C acceptance-governance head, then activate/revalidate WP-2.6D; WP-2.7 remains blocked.",
              "Pass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**. Mechanical contact reconciliation: **PASS**; required WP-2.6C responsibilities minus accepted/evidenced responsibilities: **∅**. No dedicated `VEN-xxx`/`ACC-xxx` is invented for `FTR-026`; whole feature remains incomplete downstream.\nFinal WP-2.6C acceptance-governance head/run: `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2 — **5/5 SUCCESS**; attempt 1 failed only from runner-local Supabase port `54322` collision and required no repo change.\nNext permitted action: WP-2.6D specification/activation revalidation; WP-2.7 remains blocked."
          )
          replace_exact(
              matrix,
              "Primary Feature: FTR-026 Lot-2 interaction responsibility.  ",
              "Primary Feature: FTR-026 Lot-2 interaction responsibility.  \nDependency gate: WP-2.6C **ACCEPTED / acceptance-governance verified** on `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2.  \nActivation stop-condition identified and frozen before code: deterministic interaction history is `occurred_at DESC, created_at DESC, id ASC`; provider order must preserve PostgreSQL microsecond chronology and TypeScript must not re-sort after millisecond canonicalization; `next_follow_up_at` is independently strict metadata and has no invented ordering/inequality semantics.  \nPacket remains **PLANNED / PLAN** until this specification-freeze HEAD is verified 5/5; only then may the READY transition occur.  "
          )

          # Live-state guardrails: D must still be planned and no product implementation claim may appear.
          dtext = Path(d).read_text()
          if "- State: `PLANNED`" not in dtext or "- Current pass: `PLAN`" not in dtext:
              raise SystemExit("WP-2.6D state/pass changed unexpectedly")
          if "## Pass A — IMPLEMENT\n\nNot started." not in dtext:
              raise SystemExit("WP-2.6D Pass A was changed unexpectedly")
          PY

          rm .github/workflows/wp26d-spec-freeze-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/wp26d-spec-freeze-staging.yml docs/domain/VENUE-COMMERCIAL-WORKFLOW-BOUNDARY-ADDENDUM.md docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md docs/roadmap/lot-2/WP-2.6C.md docs/roadmap/lot-2/WP-2.6D.md "
          test "$changed" = "$expected"
          git commit -m "docs: freeze WP-2.6D interaction ordering"
          git push
