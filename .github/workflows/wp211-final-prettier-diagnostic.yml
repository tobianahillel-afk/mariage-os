name: WP-2.11 final Prettier diagnostic

on:
  push:
    branches:
      - diagnostic/wp211-final-prettier-20261004

permissions:
  contents: read

jobs:
  prettier:
    name: Print pinned final Prettier diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply pinned Prettier and print exact diff
        run: |
          npx prettier --write \
            src/application/venues/venue-workspace-read-service-decision-context.test.ts \
            src/application/venues/venue-workspace-read-service.coverage.test.ts \
            src/ui/venues/venue-workspace-decision-presentation.coverage.test.ts
          git diff -- \
            src/application/venues/venue-workspace-read-service-decision-context.test.ts \
            src/application/venues/venue-workspace-read-service.coverage.test.ts \
            src/ui/venues/venue-workspace-decision-presentation.coverage.test.ts
