name: SDK Lock Apply

on:
  push:
    branches:
      - lot-1/identity-project-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install @supabase/supabase-js@2.112.4 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock update when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add official Supabase browser SDK"
          git push origin HEAD:lot-1/identity-project-foundation
