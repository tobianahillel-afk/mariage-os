name: Format WP-2.6C staging

on:
  push:
    branches:
      - lot-2/wp26c-impl-staging
    paths:
      - .github/workflows/zz-wp26c-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: lot-2/wp26c-impl-staging
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only WP-2.6C TypeScript files
        run: >-
          npx prettier --write
          src/application/venues/venue-contact-persistence-error.ts
          src/application/venues/venue-contact-service.test.ts
          src/application/venues/venue-contact-service.ts
          src/domain/venues/venue-contact.test.ts
          src/infrastructure/supabase/parse-venue-contact-row.test.ts
          src/infrastructure/supabase/supabase-venue-contact-adapter.test.ts
          src/infrastructure/supabase/supabase-venue-contact-adapter.ts
      - run: npm run format:check
      - run: git diff --check
      - name: Commit deterministic formatting and remove runner
        run: |
          rm .github/workflows/zz-wp26c-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: format WP-2.6C venue contacts'
          git push origin HEAD:lot-2/wp26c-impl-staging
