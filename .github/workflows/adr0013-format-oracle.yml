name: ADR 0013 formatting oracle

on:
  push:
    branches:
      - lot-2/wp29c-adr0013-format-staging

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format exact remaining file
        run: npx prettier --write scripts/run-private-document-ar006-ingress-observability-preflight.mjs
      - name: Emit formatted file as base64
        run: |
          printf 'FORMATTED_BASE64='
          base64 -w0 scripts/run-private-document-ar006-ingress-observability-preflight.mjs
          printf '\n'
