name: WP-2.11 decision Prettier diagnostic

on:
  push:
    branches:
      - diagnostic/wp211-decision-prettier-20261004

permissions:
  contents: read

jobs:
  prettier:
    name: Print pinned Prettier diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply pinned Prettier and print exact diff
        run: |
          npx prettier --write src/ui/venues/venue-workspace-decision-presentation.ts
          git diff -- src/ui/venues/venue-workspace-decision-presentation.ts
          test -z "$(git status --short -- src/ui/venues/venue-workspace-decision-presentation.ts)"
