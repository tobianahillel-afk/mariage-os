name: Format WP-2.6B microsecond control

on:
  push:
    branches:
      - lot-2/venues-core
    paths:
      - .github/workflows/format-wp26b-microsecond-control.yml

permissions:
  contents: write

jobs:
  format_control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and self-clean
        run: |
          npx prettier --write src/infrastructure/supabase/venue-availability-microsecond-order-adversarial.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/supabase/venue-availability-microsecond-order-adversarial.test.ts
          git rm .github/workflows/format-wp26b-microsecond-control.yml
          git commit -m "test: format WP-2.6B microsecond red control exactly"
          git push origin HEAD:lot-2/venues-core
