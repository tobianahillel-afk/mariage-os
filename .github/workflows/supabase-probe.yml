name: WP-0.4 Supabase local verification

on:
  push:
    branches:
      - lot-0/repository-tooling
    paths:
      - .github/workflows/supabase-probe.yml
      - package.json
      - package-lock.json
      - supabase/**

permissions:
  contents: read

jobs:
  verify-local-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean branch state
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean reproducible install
        run: npm ci --no-audit --no-fund

      - name: Start local Supabase without production credentials
        run: npm run db:start

      - name: Reset, seed and execute direct DB tests
        run: npm run db:verify

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
