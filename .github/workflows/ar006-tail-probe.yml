name: AR-006 Pages tail CPU capability probe

on:
  push:
    branches:
      - lot-2/venues-core

permissions:
  contents: read

concurrency:
  group: mariage-os-ar006-tail-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tail-probe:
    name: AR-006 Pages tail CPU capability probe
    if: >-
      contains(github.event.head_commit.message, '[AR006-TAIL-PREFLIGHT]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ar006-isolated
    env:
      AR006_PAGES_PROJECT: ${{ vars.AR006_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AR006_WORKERS_FREE_ATTESTATION: ${{ vars.AR006_WORKERS_FREE_ATTESTATION }}
      AR006_TAIL_DEPLOYMENT_ID: 064d50b9-3c3d-414e-a6c3-afdcc1051be9
      AR006_TAIL_DEPLOYMENT_URL: https://064d50b9.mariage-os-ar006-isolated.pages.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - name: Tail exact Pages deployment around deny-only smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AR006_CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          : > ar006-pages-tail-raw.log
          npx --yes wrangler@4.131.2 pages deployment tail "$AR006_TAIL_DEPLOYMENT_ID" \
            --project-name "$AR006_PAGES_PROJECT" \
            --format json > ar006-pages-tail-raw.log 2>&1 &
          tail_pid=$!
          cleanup() {
            kill "$tail_pid" 2>/dev/null || true
            wait "$tail_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 8
          PRIVATE_DOCUMENT_SMOKE_BASE_URL="$AR006_TAIL_DEPLOYMENT_URL" \
            npm run smoke:private-document-production
          sleep 8
          cleanup
          trap - EXIT
      - name: Sanitize and require provider CPU field
        run: node scripts/run-private-document-ar006-tail-probe-result.mjs
      - name: Retain sanitized tail capability result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wp-2.9c-ar006-tail-probe-${{ github.sha }}
          path: ar006-pages-tail-probe.json
          if-no-files-found: warn
          retention-days: 30
