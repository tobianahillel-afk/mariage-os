name: WP-2.6C Pass A governance staging

on:
  push:
    branches:
      - lot-2/wp26c-passa-transition-staging

permissions:
  contents: write

jobs:
  patch-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: lot-2/wp26c-passa-transition-staging
      - name: Apply exact governance replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p = Path(path)
              data = p.read_text()
              count = data.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(data.replace(old, new))

          wp = "docs/roadmap/lot-2/WP-2.6C.md"
          rep(wp,
              "- State: `IN_PROGRESS`\n- Current pass: `A-IMPLEMENT`",
              "- State: `REVIEW_PENDING`\n- Current pass: `B-ADVERSARIAL`")
          rep(wp,
              "**IN_PROGRESS.** Entry gate `caa01a39c73a68a9f03df8a6d4a2c7ec6d12fd84` / `34278672342` is 5/5 SUCCESS. Implement only the Venue-contact vertical slice. Start with an explicit red-first proof before migration/domain/adapter remediation; do not activate WP-2.6D concurrently.",
              "**COMPLETE / VERIFIED.** Entry gate `caa01a39c73a68a9f03df8a6d4a2c7ec6d12fd84` / `34278672342` was 5/5 SUCCESS. Initial red-first `937da5b7124e9a93b9e4fa62e9bf8ae1bbec42e1` / `34280436812` proved the contact table and atomic `save_venue_contact` command were absent before implementation. The bounded vertical slice now includes canonical contact domain validation, one create/update service with expected revision, fail-closed provider parser/adapter, project-scoped contact persistence/RLS and the atomic security-definer save command. Baseline implementation head `b8106fb7139829ea99392853837dd602f08c60fe` / `34281764493` was 5/5 SUCCESS. A separate non-disclosure red-first on `56c79ee3064384b5425699742a3b8c2a21fd4aa7` / `34282681713` failed exactly because a foreign-project UUID collision returned `23505` instead of generic `42501`; forward-only migration `20260908235500_harden_venue_contact_cross_project_identity.sql` closes that oracle without changing same-project duplicate conflict semantics. Final Pass-A implementation head `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400` is 5/5 SUCCESS: 111 unit files / 1037 tests PASS at 100% measured statements/branches/functions/lines; DB/RLS PASS including the red-first collision proof; Browser E2E + mutation PASS; privacy-safe preview PASS; clean-checkout `npm run verify` PASS. Scope remained contact-only; WP-2.6D and WP-2.7 were not started.")
          rep(wp,
              "## Pass B — ADVERSARIAL REVIEW\n\nNot started.",
              "## Pass B — ADVERSARIAL REVIEW\n\n**READY FOR FRESH REVIEW.** Reconstruct authorization, revision/concurrency, cross-project UUID non-disclosure, parent immutability, canonical value parity, provider fail-closed behavior and direct-table denial independently from the Pass-A implementation. Pass-A green evidence is necessary but not sufficient for Pass B.")
          rep(wp,
              "- Current state: `IN_PROGRESS`\n- Current/next pass: `A-IMPLEMENT`\n- WP-2.6C split-governance entry: `caa01a39c73a68a9f03df8a6d4a2c7ec6d12fd84` / `34278672342` — **5/5 SUCCESS**\n- Split finding: combined contacts/interactions packet would exceed 10 points once real contact command/revision boundaries are counted; **RESOLVED by decomposition before production code**\n- Remaining blocker/finding: none at Pass-A entry\n- Next permitted action: execute WP-2.6C Pass A with red-first evidence, then verify the exact implementation head. Do not start WP-2.6D or WP-2.7 concurrently.",
              "- Current state: `REVIEW_PENDING`\n- Current/next pass: `B-ADVERSARIAL`\n- WP-2.6C split-governance entry: `caa01a39c73a68a9f03df8a6d4a2c7ec6d12fd84` / `34278672342` — **5/5 SUCCESS**\n- Pass-A final implementation head/run: `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400` — **5/5 SUCCESS**\n- Red-first security hardening: `56c79ee3064384b5425699742a3b8c2a21fd4aa7` / `34282681713` — expected DB FAILURE, foreign-project collision `23505` vs required `42501`; **RESOLVED / VERIFIED** on the final Pass-A head/run\n- Split finding: combined contacts/interactions packet would exceed 10 points once real contact command/revision boundaries are counted; **RESOLVED by decomposition before production code**\n- Remaining BLOCKING/MAJOR finding at Pass-A handoff: none known; Pass B must reconstruct independently\n- Next permitted action: perform fresh WP-2.6C Pass B adversarial review on the exact verified governance head. Do not start WP-2.6D or WP-2.7 concurrently.")

          status = "docs/roadmap/IMPLEMENTATION-STATUS.md"
          rep(status,
              "| WP-2.6C | Venue contacts | **READY** |",
              "| WP-2.6C | Venue contacts | **REVIEW_PENDING** |")
          rep(status,
              "- `WP-2.6C` — Venue contacts — **READY / PLAN**, revalidated at 9 points with one contact table, one atomic save command family and one RLS boundary;",
              "- `WP-2.6C` — Venue contacts — **REVIEW_PENDING / B-ADVERSARIAL**, Pass A complete on `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400` with contact persistence/RLS/revision/provider boundaries and cross-project UUID non-disclosure verified;")
          marker = "Required original WP-2.6 responsibilities minus assigned A/B/C/D responsibilities: **∅**. WP-2.6A and WP-2.6B responsibilities are accepted/evidenced with gap **∅**; the original parent responsibility remains incomplete until C/D are accepted.\n\n### WP-2.6A Pass A"
          replacement = "Required original WP-2.6 responsibilities minus assigned A/B/C/D responsibilities: **∅**. WP-2.6A and WP-2.6B responsibilities are accepted/evidenced with gap **∅**; WP-2.6C has completed Pass A but is not accepted; the original parent responsibility remains incomplete until C/D are accepted.\n\n### WP-2.6C Pass A\n\n- initial red-first `937da5b7124e9a93b9e4fa62e9bf8ae1bbec42e1` / `34280436812`: expected DB failure before contact persistence/command existed;\n- implementation baseline `b8106fb7139829ea99392853837dd602f08c60fe` / `34281764493`: **5/5 SUCCESS**;\n- foreign-project UUID non-disclosure red-first `56c79ee3064384b5425699742a3b8c2a21fd4aa7` / `34282681713`: expected DB FAILURE with `have: 23505`, `want: 42501`;\n- final remediation/implementation `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400`: **5/5 SUCCESS**; Core 111 files / 1037 tests at 100% measured statements/branches/functions/lines, DB/RLS PASS, Browser E2E + mutation PASS, privacy-safe preview PASS, clean-checkout `npm run verify` PASS;\n- Pass A decision: **COMPLETE / VERIFIED — transition to REVIEW_PENDING / B-ADVERSARIAL**; interactions (WP-2.6D) and WP-2.7 remain unstarted.\n\n### WP-2.6A Pass A"
          rep(status, marker, replacement)
          rep(status, "Packet State: READY", "Packet State: REVIEW_PENDING")
          rep(status, "Current Pass: PLAN", "Current Pass: B-ADVERSARIAL")
          rep(status,
              "WP-2.6C split decision: mandatory >10 prevention; contacts → C (9 points), interactions → D (9 points); fragmentation review PASS\nOpen WP-2.6B BLOCKING/MAJOR findings: ∅\nRequired WP-2.6B responsibilities minus accepted/evidenced responsibilities: ∅\nNext permitted action: verify the exact WP-2.6C split/READY governance HEAD, then transition WP-2.6C only to IN_PROGRESS / A-IMPLEMENT. Do not start WP-2.6D or WP-2.7 concurrently.",
              "WP-2.6C split decision: mandatory >10 prevention; contacts → C (9 points), interactions → D (9 points); fragmentation review PASS\nWP-2.6C Pass-A final head/run: aee0572cebddc0eae26e898fe68a008009263d11 / 34282995400 — 5/5 SUCCESS\nWP-2.6C cross-project non-disclosure red-first: 56c79ee3064384b5425699742a3b8c2a21fd4aa7 / 34282681713 — expected DB FAILURE; resolved on final Pass-A head\nOpen WP-2.6C BLOCKING/MAJOR findings at Pass-A handoff: none known; fresh Pass B pending\nRequired WP-2.6B responsibilities minus accepted/evidenced responsibilities: ∅\nNext permitted action: perform fresh WP-2.6C Pass B adversarial review after verifying this governance transition head. Do not start WP-2.6D or WP-2.7 concurrently.")
          rep(status,
              "- Original WP-2.6 product responsibility remains execution-mapped to WP-2.6A/B/C; A+B are accepted while WP-2.6C remains not started.",
              "- Original WP-2.6 product responsibility remains execution-mapped to WP-2.6A/B/C/D; A+B are accepted, WP-2.6C is **REVIEW_PENDING / B-ADVERSARIAL**, and WP-2.6D remains planned.")
          rep(status,
              "Accepted Lot-2 packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A\nLast completed packet: WP-2.6A — ACCEPTED / COMPLETE\nCurrent packet: WP-2.6B — ACCEPTANCE_PENDING / C-ACCEPTANCE\nCurrent commercial packet: WP-2.6C — READY / PLAN",
              "Accepted Lot-2 packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B\nLast completed packet: WP-2.6B — ACCEPTED / COMPLETE\nCurrent packet: WP-2.6C — REVIEW_PENDING / B-ADVERSARIAL\nCurrent commercial packet: WP-2.6C — REVIEW_PENDING / B-ADVERSARIAL")
          rep(status,
              "Next permitted action: verify the exact WP-2.6C split/READY governance HEAD, then transition WP-2.6C only to IN_PROGRESS / A-IMPLEMENT. WP-2.6D and WP-2.7 remain prohibited concurrently.",
              "Next permitted action: verify the exact WP-2.6C Pass-A transition governance HEAD, then perform fresh WP-2.6C Pass B adversarial review. WP-2.6D and WP-2.7 remain prohibited concurrently.")

          matrix = "docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md"
          rep(matrix,
              "Status: **IN_PROGRESS — WP-2.1..WP-2.6B ACCEPTED; WP-2.6C READY AFTER MANDATORY SIZING SPLIT; WP-2.6D PLANNED**",
              "Status: **IN_PROGRESS — WP-2.1..WP-2.6B ACCEPTED; WP-2.6C REVIEW_PENDING / B-ADVERSARIAL; WP-2.6D PLANNED**")
          rep(matrix,
              "A+B are accepted, C is READY after mandatory sizing split and D remains planned.",
              "A+B are accepted, C has completed Pass A and is REVIEW_PENDING / B-ADVERSARIAL, and D remains planned.")
          rep(matrix,
              "Next permitted action: verify the exact WP-2.6C split/READY governance HEAD, then transition WP-2.6C only to `IN_PROGRESS / A-IMPLEMENT`. WP-2.6D and WP-2.7 remain blocked concurrently.",
              "Next permitted action: verify the exact WP-2.6C Pass-A transition governance HEAD, then perform fresh `B-ADVERSARIAL`. WP-2.6D and WP-2.7 remain blocked concurrently.")
          rep(matrix,
              "State: **READY**\nCurrent pass: **PLAN**\n\nPrimary Feature: FTR-026 Lot-2 contact responsibility.",
              "State: **REVIEW_PENDING**\nCurrent pass: **B-ADVERSARIAL**\n\nPrimary Feature: FTR-026 Lot-2 contact responsibility.")
          rep(matrix,
              "Scope: caller-owned Venue contact identity, canonical phone/text validation, create/update with expected revision, immutable parent identity, RLS and fail-closed provider parsing. Interaction history is now WP-2.6D.\nNext permitted action: exact full CI on this READY/split-governance head, then transition WP-2.6C only to `IN_PROGRESS / A-IMPLEMENT`.",
              "Scope: caller-owned Venue contact identity, canonical phone/text validation, create/update with expected revision, immutable parent identity, RLS and fail-closed provider parsing. Interaction history is now WP-2.6D.\nVerified Pass-A implementation head/run: `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400` — **5/5 SUCCESS**; 111 unit files / 1037 tests at 100% measured statements/branches/functions/lines; DB/RLS, Browser+mutation, preview and clean-checkout verify PASS. Cross-project UUID non-disclosure red-first `56c79ee3064384b5425699742a3b8c2a21fd4aa7` / `34282681713` failed exactly `23505` vs required `42501` and is resolved on the final Pass-A head.\nNext permitted action: verify this Pass-A governance transition, then perform fresh WP-2.6C `B-ADVERSARIAL`; WP-2.6D remains blocked.")
          rep(matrix, "WP-2.6C [PLANNED]", "WP-2.6C [REVIEW_PENDING]")
          rep(matrix,
              "WP-2.6A and WP-2.6B are ACCEPTED; after the exact WP-2.6B acceptance-governance HEAD is verified, WP-2.6C is the next packet to activate/revalidate. WP-2.7 must not start concurrently.",
              "WP-2.6A and WP-2.6B are ACCEPTED; WP-2.6C has completed verified Pass A and is REVIEW_PENDING / B-ADVERSARIAL. WP-2.6D and WP-2.7 must not start concurrently.")
          PY
          rm .github/workflows/wp26c-passa-transition-staging.yml
          git diff --check
      - name: Commit staged governance tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/WP-2.6C.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md .github/workflows/wp26c-passa-transition-staging.yml
          git commit -m "docs: complete WP-2.6C Pass A transition"
          git push origin HEAD:lot-2/wp26c-passa-transition-staging
