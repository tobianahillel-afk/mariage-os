name: AR-006 route recheck Prettier diagnostic

on:
  push:
    branches:
      - diagnostic/ar006-route-recheck-prettier

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          set -eu
          FILE="src/infrastructure/supabase/private-document-ar006-do-route-recheck-contract.test.ts"
          npx prettier --write "$FILE"
          git diff -- "$FILE"
          test -n "$(git diff -- "$FILE")"
