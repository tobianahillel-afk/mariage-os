name: WP-2.6B exact single-file formatting

on:
  push:
    branches:
      - lot-2/venues-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact formatting and remove tooling
        shell: bash
        run: |
          npx prettier --write src/domain/venues/venue-availability.ts
          rm .github/workflows/wp26b-format-one.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/venues/venue-availability.ts .github/workflows/wp26b-format-one.yml
          git commit -m "style: apply exact venue availability formatting"
          git push origin HEAD:lot-2/venues-core
