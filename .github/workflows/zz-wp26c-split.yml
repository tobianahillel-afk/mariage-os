name: Guarded WP-2.6C sizing split

on:
  push:
    branches:
      - lot-2/wp26c-split-staging
    paths:
      - .github/workflows/zz-wp26c-split.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: lot-2/wp26c-split-staging
          fetch-depth: 0
      - name: Apply guarded split
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/guarded_wp26c_split.py
          git diff --check
          test "$(grep -c 'State: `READY`' docs/roadmap/lot-2/WP-2.6C.md)" -eq 1
          test "$(grep -c 'State: `PLANNED`' docs/roadmap/lot-2/WP-2.6D.md)" -eq 1
          grep -Fq 'Required current-lot responsibilities minus assigned packet responsibilities: **∅**.' docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md
          grep -Fq 'Required original WP-2.6 responsibilities minus assigned A/B/C/D responsibilities: **∅**.' docs/roadmap/IMPLEMENTATION-STATUS.md
          ! grep -Fq 'SEC-DATA-' docs/roadmap/lot-2/WP-2.6C.md
          ! grep -Fq 'SEC-DATA-' docs/roadmap/lot-2/WP-2.6D.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-wp26c-split.yml .github/scripts/guarded_wp26c_split.py
          git add docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md docs/roadmap/lot-2/WP-2.6C.md docs/roadmap/lot-2/WP-2.6D.md
          git commit -m 'docs: split WP-2.6C contacts and interactions'
          git push origin HEAD:lot-2/wp26c-split-staging
