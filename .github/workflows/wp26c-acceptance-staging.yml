name: WP-2.6C acceptance staging

on:
  push:
    branches:
      - lot-2/wp26c-acceptance-staging

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply asserted WP-2.6C acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          wp = "docs/roadmap/lot-2/WP-2.6C.md"
          replace_exact(wp, "- State: `ACCEPTANCE_PENDING`", "- State: `ACCEPTED`")
          replace_exact(wp, "- Current pass: `C-ACCEPTANCE`", "- Current pass: `COMPLETE`")
          replace_exact(
              wp,
              "**READY TO START.** Perform the mechanical EXPECTED → IMPLEMENTED → VERIFIED reconciliation for the WP-2.6C-owned contact responsibility, applicable AUTHZ/SEC controls and explicit scope boundaries. Whole `FTR-026` must remain broader than this packet because interaction history and later presentation responsibilities are downstream.",
              """Entry head/run `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702`: **5/5 SUCCESS**, including Core quality/security, Local Supabase DB/RLS, Browser E2E + mutation, privacy-safe preview and Full verify from clean checkout.\n\n### Entry gate\n\n- [x] packet entered Pass C from `ACCEPTANCE_PENDING`\n- [x] current pass was `C-ACCEPTANCE`\n- [x] no unresolved BLOCKING/MAJOR Pass-B finding exists\n- [x] exact Pass-C transition governance head is 5/5 green\n\n| Responsibility | Expected | Implemented evidence | Verified evidence | Result |\n|---|---|---|---|---|\n| Contact identity/details and canonical values | Venue-owned caller-UUID contact reference; bounded optional text; exact ASCII international phone/WhatsApp grammar; canonical null/trim semantics | `venue-contact` domain normalization, contact service/ports, `contacts` persistence and SQL checks | domain/service tests, TypeScript↔PostgreSQL phone/text parity, dedicated Pass-B pgTAP + `34286647702` | PASS |\n| Atomic create/update and revision semantics | one save command family; create requires expected revision 0; update requires exact current revision; stale writes fail without partial mutation | `save_venue_contact`, expected-revision service mapping and privileged RPC | service/adapter tests + DB stale-revision/create-update assertions | PASS |\n| Immutable project/Venue parent identity | updates cannot reparent a contact to another project or Venue | immutable parent fields/SQL command checks and exact receipt identity validation | same-project reparent adversarial pgTAP + provider identity tests | PASS |\n| UUID conflict and cross-project non-disclosure | same-project duplicate create remains typed uniqueness conflict; foreign-project UUID collision reveals no resource existence/content | hardened cross-project identity branch in `save_venue_contact` | red-first `56c79ee...` plus final DB proof: same-project `23505`, foreign-project `42501` | PASS |\n| Authorization, RLS and revocation concurrency | reads require live `venues.read`; writes require live `venues.write`; direct table mutation denied; downgrade/revocation takes effect without relogin and serializes with writes | SELECT-only authenticated grant, project-scoped RLS, writer helper/RPC taking the shared project lock before permission evaluation | owner/editor/viewer/outsider/project-B/revoked matrix + same-session downgrade/revocation adversarial pgTAP | PASS |\n| Provider/list trust boundary | save receipt must match exact identity/payload/resulting revision; malformed rows, duplicate list IDs and provider inconsistencies fail closed | strict contact parser and Supabase adapter receipt/list validation | parser/adapter malformed-success, duplicate-identity and receipt tests | PASS |\n| Scope boundaries | no contact delete lifecycle, interaction history, Task/Vendor/offline/UI authority is introduced | contact-only domain/application/adapter/migrations/tests | Pass-B diff review + architecture/static/dead-code gates on exact Pass-C entry head | PASS |\n\n### Acceptance checks\n\n- [x] all WP-2.6C-owned responsibilities reconciled\n- [x] FIR-equivalent durable packet fields/evidence are complete for the contact slice\n- [x] required automated evidence is green on the exact Pass-C entry head\n- [x] no BLOCKING/MAJOR finding remains\n- [x] architecture/complexity/static/security gates are green\n- [x] documentation/status/coverage are synchronized for packet acceptance\n- [x] downstream ownership remains explicit\n\nApplicable `AUTHZ-001..008`, `AUTHZ-009`, `AUTHZ-012`, `AUTHZ-017`, `AUTHZ-018`, `AUTHZ-020` and the explicit applicable `SEC-*` controls listed above reconcile **PASS** for the WP-2.6C contact slice.\n\n`FTR-026` has no dedicated `VEN-xxx` requirement or direct `ACC-xxx` scenario in the normative Requirement/Feature and Acceptance/Feature matrices. Pass C therefore does not invent one: direct packet proof is the frozen contact contract, packet invariants and AUTHZ/SEC evidence. Whole `FTR-026` is **not accepted by this packet** because interaction history remains WP-2.6D, Venue presentation remains WP-2.11 and follow-up/Task workflow remains Lot 3.\n\nRequired WP-2.6C responsibilities minus accepted/evidenced WP-2.6C responsibilities: **∅**.\n\n**Pass C decision: PASS — WP-2.6C ACCEPTED.**"""
          )
          replace_exact(wp, "- Current state: `ACCEPTANCE_PENDING`", "- Current state: `ACCEPTED`")
          replace_exact(wp, "- Current/next pass: `C-ACCEPTANCE`", "- Current/next pass: `COMPLETE`")
          replace_exact(
              wp,
              "- Final fresh Pass-B reviewed head/run: `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` — **5/5 SUCCESS**; dedicated authorization/concurrency/parent/phone-parity pgTAP PASS; open BLOCKING/MAJOR findings **∅**",
              "- Final fresh Pass-B reviewed head/run: `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` — **5/5 SUCCESS**; dedicated authorization/concurrency/parent/phone-parity pgTAP PASS; open BLOCKING/MAJOR findings **∅**\n- Pass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**; responsibility gap **∅**; Pass C **PASS**"
          )
          replace_exact(
              wp,
              "- Next permitted action: verify the exact WP-2.6C Pass-C transition governance HEAD, then perform mechanical Pass C reconciliation. Do not start WP-2.6D or WP-2.7 concurrently.",
              "- Next permitted action: verify the exact WP-2.6C acceptance-governance HEAD. Only after that 5/5 verification may WP-2.6D activation/revalidation begin; WP-2.7 remains blocked."
          )

          status = "docs/roadmap/IMPLEMENTATION-STATUS.md"
          replace_exact(status, "| WP-2.6C | Venue contacts | **ACCEPTANCE_PENDING** |", "| WP-2.6C | Venue contacts | **ACCEPTED** |")
          replace_exact(
              status,
              "- WP-2.6B ACCEPTED; `WP2.6B-B-001..005` resolved/verified; final fresh reviewed head `e92af194f774895b3b397d3be60350d09d42d8ff`, CI `34263468532` 5/5; corrected Pass-C entry `6e091cc5088fece027f13c6764092453da18f418` / `34274455248` 5/5; responsibility gap **∅**; final acceptance-governance verification `8911f1523d96b95cf1329c4b144bfec2356a4a47` / `34275967235` 5/5.",
              "- WP-2.6B ACCEPTED; `WP2.6B-B-001..005` resolved/verified; final fresh reviewed head `e92af194f774895b3b397d3be60350d09d42d8ff`, CI `34263468532` 5/5; corrected Pass-C entry `6e091cc5088fece027f13c6764092453da18f418` / `34274455248` 5/5; responsibility gap **∅**; final acceptance-governance verification `8911f1523d96b95cf1329c4b144bfec2356a4a47` / `34275967235` 5/5.\n- WP-2.6C ACCEPTED; fresh Pass B `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` 5/5 with no open BLOCKING/MAJOR finding; Pass-C entry `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` 5/5; contact responsibility gap **∅**; whole `FTR-026` remains incomplete pending WP-2.6D/WP-2.11/Lot 3."
          )
          replace_exact(
              status,
              "- `WP-2.6C` — Venue contacts — **ACCEPTANCE_PENDING / C-ACCEPTANCE**, Pass A complete on `aee0572cebddc0eae26e898fe68a008009263d11` / `34282995400`; fresh Pass B PASS on `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` with no open BLOCKING/MAJOR finding;",
              "- `WP-2.6C` — Venue contacts — **ACCEPTED / COMPLETE**, Pass-C entry `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` 5/5; required contact responsibility gap **∅**; whole `FTR-026` remains incomplete;"
          )
          replace_exact(
              status,
              "Required original WP-2.6 responsibilities minus assigned A/B/C/D responsibilities: **∅**. WP-2.6A and WP-2.6B responsibilities are accepted/evidenced with gap **∅**; WP-2.6C has completed Pass A and fresh Pass B but is not accepted pending Pass C; the original parent responsibility remains incomplete until C/D are accepted.",
              "Required original WP-2.6 responsibilities minus assigned A/B/C/D responsibilities: **∅**. WP-2.6A, WP-2.6B and WP-2.6C responsibilities are accepted/evidenced with gap **∅**; the original parent responsibility remains incomplete until WP-2.6D is accepted."
          )
          pass_b_tail = "- Pass B decision: **PASS — transition to ACCEPTANCE_PENDING / C-ACCEPTANCE**."
          replace_exact(
              status,
              pass_b_tail,
              pass_b_tail + """\n\n### WP-2.6C Pass C\n\n- exact Pass-C entry head/run `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702`: **5/5 SUCCESS**, including clean-checkout `npm run verify`;\n- mechanical EXPECTED → IMPLEMENTED → VERIFIED reconciliation covers contact identity/canonical values, atomic create/update revision semantics, immutable project/Venue parent, UUID conflict/non-disclosure, live authorization/revocation concurrency, fail-closed provider/list boundaries and explicit scope exclusions: **PASS**;\n- applicable AUTHZ/SEC controls: **PASS** for the WP-2.6C-owned contact slice; no fake `VEN-xxx` or `ACC-xxx` ownership is claimed because the normative matrices do not assign a dedicated one to `FTR-026`;\n- required WP-2.6C responsibilities minus accepted/evidenced WP-2.6C responsibilities: **∅**;\n- whole `FTR-026` remains incomplete: interaction history → WP-2.6D, Venue presentation → WP-2.11, follow-up/Task workflow → Lot 3;\n- Pass C decision: **PASS — WP-2.6C ACCEPTED**."""
          )
          replace_exact(status, "Packet State: ACCEPTANCE_PENDING\nCurrent Pass: C-ACCEPTANCE", "Packet State: ACCEPTED\nCurrent Pass: COMPLETE")
          replace_exact(status, "Last completed packet: WP-2.6B — ACCEPTED", "Last completed packet: WP-2.6C — ACCEPTED")
          replace_exact(status, "Accepted packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B", "Accepted packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B, WP-2.6C")
          replace_exact(
              status,
              "WP-2.6C final fresh Pass-B reviewed head/run: 4f43d59f113f2aa0a857ed147965fd65a8b02413 / 34285562087 — 5/5 SUCCESS\nOpen WP-2.6C BLOCKING/MAJOR findings after fresh Pass B: ∅\nWP-2.6C Pass-A implementation + Pass-B adversarial review are VERIFIED but not yet ACCEPTED; packet acceptance remains pending Pass C.\nNext permitted action: verify this Pass-C transition governance head, then perform WP-2.6C mechanical Pass C reconciliation. Do not start WP-2.6D or WP-2.7 concurrently.",
              "WP-2.6C final fresh Pass-B reviewed head/run: 4f43d59f113f2aa0a857ed147965fd65a8b02413 / 34285562087 — 5/5 SUCCESS\nWP-2.6C Pass-C entry head/run: b8d451ec0d39239894fc9d6e1b84142015610fbe / 34286647702 — 5/5 SUCCESS\nOpen WP-2.6C BLOCKING/MAJOR findings after Pass C: ∅\nWP-2.6C contact responsibility: ACCEPTED / COMPLETE; required minus accepted/evidenced = ∅; whole FTR-026 remains incomplete downstream.\nNext permitted action: verify this WP-2.6C acceptance-governance head. Only after 5/5 verification may WP-2.6D activation/revalidation begin; WP-2.7 remains blocked."
          )
          replace_exact(
              status,
              "- Original WP-2.6 product responsibility remains execution-mapped to WP-2.6A/B/C/D; A+B are accepted, WP-2.6C is **ACCEPTANCE_PENDING / C-ACCEPTANCE**, and WP-2.6D remains planned.",
              "- Original WP-2.6 product responsibility remains execution-mapped to WP-2.6A/B/C/D; A+B+C are accepted, WP-2.6D remains planned, and whole `FTR-026` is not yet complete."
          )
          replace_exact(status, "Accepted Lot-2 packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B", "Accepted Lot-2 packets: WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B, WP-2.6C")
          replace_exact(status, "Last completed packet: WP-2.6B — ACCEPTED / COMPLETE", "Last completed packet: WP-2.6C — ACCEPTED / COMPLETE")
          replace_exact(status, "Current packet: WP-2.6C — ACCEPTANCE_PENDING / C-ACCEPTANCE", "Current packet: WP-2.6C — ACCEPTED / COMPLETE")
          replace_exact(status, "Current commercial packet: WP-2.6C — ACCEPTANCE_PENDING / C-ACCEPTANCE", "Current commercial packet: WP-2.6C — ACCEPTED / COMPLETE")
          replace_exact(
              status,
              "WP-2.6C final fresh Pass B: 4f43d59f... / 34285562087 — 5/5 SUCCESS; open BLOCKING/MAJOR findings ∅\nNext permitted action: verify the exact WP-2.6C Pass-C transition governance HEAD, then perform mechanical WP-2.6C Pass C reconciliation. WP-2.6D and WP-2.7 remain prohibited concurrently.",
              "WP-2.6C final fresh Pass B: 4f43d59f... / 34285562087 — 5/5 SUCCESS; open BLOCKING/MAJOR findings ∅\nWP-2.6C Pass-C entry: b8d451ec... / 34286647702 — 5/5 SUCCESS; responsibility gap ∅; Pass C PASS\nNext permitted action: verify the exact WP-2.6C acceptance-governance HEAD; then activate/revalidate WP-2.6D. WP-2.7 remains prohibited concurrently."
          )

          matrix = "docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md"
          replace_exact(
              matrix,
              "Status: **IN_PROGRESS — WP-2.1..WP-2.6B ACCEPTED; WP-2.6C ACCEPTANCE_PENDING / C-ACCEPTANCE; WP-2.6D PLANNED**",
              "Status: **IN_PROGRESS — WP-2.1..WP-2.6C ACCEPTED; WP-2.6D PLANNED**"
          )
          replace_exact(
              matrix,
              "Accepted/evidenced packet responsibilities so far: **WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A and WP-2.6B**. Required WP-2.6A responsibilities minus accepted/evidenced WP-2.6A responsibilities: **∅**. Required WP-2.6B responsibilities minus accepted/evidenced WP-2.6B responsibilities: **∅**. The original WP-2.6 responsibility remains fully assigned after orchestration decomposition: offers/components → WP-2.6A, availability → WP-2.6B, contacts → WP-2.6C, interactions → WP-2.6D; A+B are accepted, C has completed Pass A and fresh Pass B and is ACCEPTANCE_PENDING / C-ACCEPTANCE, and D remains planned. The FTR-022 presentation/UI responsibility remains explicitly assigned to WP-2.11 and is not claimed by WP-2.5. Lot-level accepted/evidenced reconciliation remains intentionally incomplete until all packets and the separate Integration Pass finish.",
              "Accepted/evidenced packet responsibilities so far: **WP-2.1, WP-2.2, WP-2.3, WP-2.4, WP-2.5, WP-2.6A, WP-2.6B and WP-2.6C**. Required WP-2.6A responsibilities minus accepted/evidenced WP-2.6A responsibilities: **∅**. Required WP-2.6B responsibilities minus accepted/evidenced WP-2.6B responsibilities: **∅**. Required WP-2.6C responsibilities minus accepted/evidenced WP-2.6C responsibilities: **∅**. The original WP-2.6 responsibility remains fully assigned after orchestration decomposition: offers/components → WP-2.6A, availability → WP-2.6B, contacts → WP-2.6C, interactions → WP-2.6D; A+B+C are accepted and D remains planned. Whole `FTR-026` remains incomplete because interaction history, Venue presentation and Lot-3 follow-up/Task responsibilities are downstream. The FTR-022 presentation/UI responsibility remains explicitly assigned to WP-2.11 and is not claimed by WP-2.5. Lot-level accepted/evidenced reconciliation remains intentionally incomplete until all packets and the separate Integration Pass finish."
          )
          replace_exact(matrix, "State: **ACCEPTANCE_PENDING**\nCurrent pass: **C-ACCEPTANCE**", "State: **ACCEPTED**\nCurrent pass: **COMPLETE**")
          replace_exact(
              matrix,
              "Final fresh Pass-B reviewed head/run: `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` — **5/5 SUCCESS**; direct grants/RLS, shared authorization locks, same-session downgrade/revocation, revision/parent immutability, UUID non-disclosure, full PostgreSQL phone parity and fail-closed provider boundaries reviewed; dedicated adversarial pgTAP passed without product-semantic remediation; open BLOCKING/MAJOR findings **∅**; review **PASS**.\nNext permitted action: verify this Pass-C transition governance head, then perform mechanical WP-2.6C Pass C reconciliation; WP-2.6D remains blocked.",
              "Final fresh Pass-B reviewed head/run: `4f43d59f113f2aa0a857ed147965fd65a8b02413` / `34285562087` — **5/5 SUCCESS**; direct grants/RLS, shared authorization locks, same-session downgrade/revocation, revision/parent immutability, UUID non-disclosure, full PostgreSQL phone parity and fail-closed provider boundaries reviewed; dedicated adversarial pgTAP passed without product-semantic remediation; open BLOCKING/MAJOR findings **∅**; review **PASS**.\nPass-C entry head/run: `b8d451ec0d39239894fc9d6e1b84142015610fbe` / `34286647702` — **5/5 SUCCESS**. Mechanical contact reconciliation: **PASS**; required WP-2.6C responsibilities minus accepted/evidenced responsibilities: **∅**. No dedicated `VEN-xxx`/`ACC-xxx` is invented for `FTR-026`; whole feature remains incomplete downstream.\nNext permitted action: verify this WP-2.6C acceptance-governance head, then activate/revalidate WP-2.6D; WP-2.7 remains blocked."
          )

          # Current-state guardrails: historical transition text may remain, but no live cursor may remain pending.
          for path in (wp, status, matrix):
              text = Path(path).read_text()
              if "Current packet: WP-2.6C — ACCEPTANCE_PENDING / C-ACCEPTANCE" in text:
                  raise SystemExit(f"{path}: stale live WP-2.6C cursor remains")
          PY

          rm .github/workflows/wp26c-acceptance-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/wp26c-acceptance-staging.yml docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md docs/roadmap/lot-2/WP-2.6C.md "
          test "$changed" = "$expected"
          git commit -m "docs: accept WP-2.6C contacts"
          git push
