name: WP-2.11 decision review RED

on:
  push:
    branches:
      - lot-2/wp211-decision-review-red-staging

permissions:
  contents: read

jobs:
  red:
    name: Targeted decision-context RED
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run targeted RED specs
        run: >-
          npx vitest run
          src/application/venues/venue-workspace-decision-review.red.test.ts
          src/application/venues/venue-workspace-presentation-review.red.test.ts
