name: Temporary Prettier diagnostic

on:
  push:
    branches:
      - lot-2/venues-core

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write src/infrastructure/supabase/supabase-private-media-lifecycle-adapter.ts src/infrastructure/supabase/supabase-private-media-lifecycle-adapter.test.ts
          git diff -- src/infrastructure/supabase/supabase-private-media-lifecycle-adapter.ts src/infrastructure/supabase/supabase-private-media-lifecycle-adapter.test.ts
