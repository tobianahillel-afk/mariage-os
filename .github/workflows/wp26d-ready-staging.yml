name: WP-2.6D READY transition staging

on:
  push:
    branches:
      - lot-2/wp26d-ready-staging

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply asserted WP-2.6D READY transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new))

          d = "docs/roadmap/lot-2/WP-2.6D.md"
          replace_exact(d, "- State: `PLANNED`\n- Current pass: `PLAN`", "- State: `READY`\n- Current pass: `A-IMPLEMENT`")
          replace_exact(
              d,
              "- WP-2.6D remains `PLANNED / PLAN` until this specification-freeze HEAD itself is 5/5 green; only then may a separate governance transition mark it `READY`.",
              "- Specification-freeze gate `1bf2640e20aa7cf7cb7d3b3524aa069b37a09c4b` / `34289908898` is **5/5 SUCCESS**, including clean-checkout `npm run verify`; the activation stop-condition is CLOSED and the packet may enter Pass A after this READY transition head is itself verified."
          )
          replace_exact(
              d,
              "- Current state: `PLANNED`\n- Current/next pass: `PLAN`\n- Dependency gate: WP-2.6C **ACCEPTED / acceptance-governance verified** on `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2\n- Activation specification: deterministic history ordering/provider precision and accepted contact interface are frozen; no material specification ambiguity remains, subject to exact-head CI of this freeze\n- Next permitted action: verify this specification-freeze HEAD 5/5. If green, perform the separate `PLANNED / PLAN` → `READY / A-IMPLEMENT` governance transition. Do not start product code or WP-2.7 before that transition is verified.",
              "- Current state: `READY`\n- Current/next pass: `A-IMPLEMENT`\n- Dependency gate: WP-2.6C **ACCEPTED / acceptance-governance verified** on `f6c93b7991d832363da92a9081540b9bad95441b` / `34287865010` attempt 2\n- Specification-freeze gate: `1bf2640e20aa7cf7cb7d3b3524aa069b37a09c4b` / `34289908898` — **5/5 SUCCESS**; deterministic history ordering/provider precision and accepted contact interface are frozen; no material specification ambiguity remains\n- Pass A implementation status: **Not started**\n- Next permitted action: verify this READY-transition HEAD 5/5. Only then begin WP-2.6D Pass A with red-first vertical-slice evidence. Do not start WP-2.7 concurrently."
          )

          status = "docs/roadmap/IMPLEMENTATION-STATUS.md"
          replace_exact(status, "| WP-2.6D | Venue interaction history | PLANNED |", "| WP-2.6D | Venue interaction history | **READY** |")
          replace_exact(
              status,
              "- `WP-2.6D` — Venue interaction history — **PLANNED / PLAN**, estimated 9 points with append/replay/history cohesion; activation revalidation freezes deterministic `occurred_at DESC, created_at DESC, id ASC` ordering and provider precision handling before READY.",
              "- `WP-2.6D` — Venue interaction history — **READY / A-IMPLEMENT**, estimated 9 points with append/replay/history cohesion; specification-freeze gate `1bf2640e20aa7cf7cb7d3b3524aa069b37a09c4b` / `34289908898` is **5/5 SUCCESS**. Pass A product implementation has not started."
          )
          replace_exact(
              status,
              "Current packet: WP-2.6D — PLANNED / PLAN\nCurrent commercial packet: WP-2.6D — PLANNED / PLAN\nPrevious commercial packet: WP-2.6C — ACCEPTED / COMPLETE",
              "Current packet: WP-2.6D — READY / A-IMPLEMENT\nCurrent commercial packet: WP-2.6D — READY / A-IMPLEMENT\nPrevious commercial packet: WP-2.6C — ACCEPTED / COMPLETE"
          )
          replace_exact(
              status,
              "WP-2.6D activation stop-condition: deterministic interaction ordering/provider precision is frozen by the current specification commit; packet remains PLANNED / PLAN pending exact-head CI\nNext permitted action: verify the exact WP-2.6D specification-freeze HEAD 5/5; then transition WP-2.6D to READY / A-IMPLEMENT. WP-2.7 remains prohibited concurrently.",
              "WP-2.6D specification freeze: 1bf2640e... / 34289908898 — 5/5 SUCCESS; deterministic interaction ordering/provider precision stop-condition CLOSED\nWP-2.6D state: READY / A-IMPLEMENT; Pass A product implementation not started\nNext permitted action: verify the exact WP-2.6D READY-transition HEAD 5/5; then begin red-first Pass A. WP-2.7 remains prohibited concurrently."
          )

          matrix = "docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md"
          replace_exact(matrix, "Status: **IN_PROGRESS — WP-2.1..WP-2.6C ACCEPTED; WP-2.6D PLANNED**", "Status: **IN_PROGRESS — WP-2.1..WP-2.6C ACCEPTED; WP-2.6D READY**")
          replace_exact(matrix, "A+B+C are accepted and D remains planned.", "A+B+C are accepted and D is READY for Pass A after exact transition-head verification.")
          replace_exact(
              matrix,
              "### WP-2.6D — Venue interaction history\n\nState: **PLANNED**\nCurrent pass: **PLAN**",
              "### WP-2.6D — Venue interaction history\n\nState: **READY**\nCurrent pass: **A-IMPLEMENT**"
          )
          replace_exact(
              matrix,
              "Packet remains **PLANNED / PLAN** until this specification-freeze HEAD is verified 5/5; only then may the READY transition occur.",
              "Specification-freeze gate `1bf2640e20aa7cf7cb7d3b3524aa069b37a09c4b` / `34289908898` is **5/5 SUCCESS**. Packet is **READY / A-IMPLEMENT**; Pass A product implementation remains not started until this READY-transition head is itself verified 5/5."
          )
          replace_exact(
              matrix,
              "Activation review retained: revalidate deterministic history ordering/provider timestamp precision and the accepted contact interface before READY.",
              "Activation review: **CLOSED** — deterministic history ordering/provider timestamp precision and the accepted contact interface are frozen and verified by `1bf2640e20aa7cf7cb7d3b3524aa069b37a09c4b` / `34289908898` 5/5."
          )

          dtext = Path(d).read_text()
          if "- State: `READY`" not in dtext or "- Current pass: `A-IMPLEMENT`" not in dtext:
              raise SystemExit("WP-2.6D READY state/pass missing")
          if "## Pass A — IMPLEMENT\n\nNot started." not in dtext:
              raise SystemExit("WP-2.6D Pass A must remain not started")
          PY

          rm .github/workflows/wp26d-ready-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/wp26d-ready-staging.yml docs/roadmap/IMPLEMENTATION-STATUS.md docs/roadmap/lot-2/LOT-2-COVERAGE-MATRIX.md docs/roadmap/lot-2/WP-2.6D.md "
          test "$changed" = "$expected"
          git commit -m "docs: activate WP-2.6D Pass A"
          git push
