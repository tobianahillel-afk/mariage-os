name: WP-2.6B remediation transition

on:
  push:
    branches: ["lot-2/venues-core"]

permissions:
  contents: write

jobs:
  patch_remediation_governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply deterministic remediation patch
        run: python .github/wp26b-remediation-transition.py
      - name: Remove transition tooling and publish
        shell: bash
        run: |
          rm .github/workflows/wp26b-remediation-transition.yml .github/wp26b-remediation-transition.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/venue_availability_test.sql docs/roadmap/lot-2/WP-2.6B.md docs/roadmap/IMPLEMENTATION-STATUS.md .github/workflows/wp26b-remediation-transition.yml .github/wp26b-remediation-transition.py
          git diff --cached --check
          git commit -m "docs: record WP-2.6B adversarial remediation"
          git push origin HEAD:lot-2/venues-core
