name: WP-2.11 coverage diagnostic

on:
  push:
    branches:
      - diagnostic/wp211-coverage-20261004

permissions:
  contents: read

jobs:
  coverage:
    name: Print uncovered statements and branches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate exact JSON coverage
        run: |
          npx vitest run --coverage --coverage.reporter=json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("coverage/coverage-final.json", "utf8"));
          const root = process.cwd() + "/";
          for (const [absolute, data] of Object.entries(report)) {
            const file = absolute.replace(root, "");
            const statements = Object.entries(data.s)
              .filter(([, count]) => count === 0)
              .map(([id]) => ({
                id,
                line: data.statementMap[id].start.line,
                endLine: data.statementMap[id].end.line,
              }));
            const functions = Object.entries(data.f)
              .filter(([, count]) => count === 0)
              .map(([id]) => ({
                id,
                name: data.fnMap[id].name,
                line: data.fnMap[id].loc.start.line,
              }));
            const branches = [];
            for (const [id, counts] of Object.entries(data.b)) {
              counts.forEach((count, index) => {
                if (count === 0) {
                  const loc = data.branchMap[id].locations[index];
                  branches.push({
                    id,
                    index,
                    type: data.branchMap[id].type,
                    line: loc.start.line,
                    endLine: loc.end.line,
                  });
                }
              });
            }
            if (statements.length || functions.length || branches.length) {
              console.log(JSON.stringify({ file, statements, functions, branches }));
            }
          }
          NODE
