name: WP-2.11 coverage diagnostic

on:
  push:
    branches:
      - diagnostic/wp211-coverage-20261004

permissions:
  contents: read

jobs:
  coverage:
    name: Print files below full coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate JSON coverage summary
        run: |
          npx vitest run --coverage --coverage.reporter=json-summary || true
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const summary = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
          for (const [file, metrics] of Object.entries(summary)) {
            if (file === "total") continue;
            const bad = ["statements","branches","functions","lines"].filter(
              (key) => metrics[key].pct < 100,
            );
            if (bad.length > 0) {
              console.log(JSON.stringify({
                file: file.replace(process.cwd() + "/", ""),
                metrics: Object.fromEntries(bad.map((key) => [key, metrics[key]])),
              }));
            }
          }
          NODE
